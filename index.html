<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Directory App</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      padding: 40px 16px;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 28px 24px;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 24px;
      color: #222;
      font-size: 22px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #444;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #007bff;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
      background-color: #007bff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 4px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0062cc;
    }

    button:disabled {
      background-color: #7ab8ff;
      cursor: not-allowed;
    }

    h3 {
      margin-top: 26px;
      margin-bottom: 12px;
      font-size: 16px;
      color: #222;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #e0e0e0;
      padding: 10px 12px;
      text-align: left;
      word-break: break-word;
    }

    th {
      background-color: #f8f9fa;
      font-weight: bold;
      color: #333;
    }

    .center-text {
      text-align: center;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Register Information</h2>

    <form id="registerForm">
      <div class="form-group">
        <label for="name">NAME:</label>
        <input type="text" id="name" placeholder="Ilagay ang pangalan" required />
      </div>

      <div class="form-group">
        <label for="address">ADDRESS:</label>
        <input type="text" id="address" placeholder="Ilagay ang address" required />
      </div>

      <button type="submit" id="submitBtn">Save to Google Sheets</button>
    </form>

    <h3>Saved Records</h3>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Address</th>
        </tr>
      </thead>
      <tbody id="recordsBody">
        <tr>
          <td colspan="2" class="center-text">Loading data...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXnB2XMKH1gvbOtNqW_K2-ZWPT6K7dCFZ3Sz27wLhnh_ztSIMd6M2rUPGGBq4YlECa/exec";

    const form = document.getElementById("registerForm");
    const nameInput = document.getElementById("name");
    const addressInput = document.getElementById("address");
    const submitBtn = document.getElementById("submitBtn");
    const recordsBody = document.getElementById("recordsBody");

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text ?? "";
      return div.innerHTML;
    }

    async function loadRecords() {
      recordsBody.innerHTML = '<tr><td colspan="2" class="center-text">Loading data...</td></tr>';

      try {
        const response = await fetch(SCRIPT_URL + "?t=" + Date.now());
        if (!response.ok) {
          throw new Error("HTTP error: " + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error(data.message || "Invalid response format.");
        }

        if (data.length === 0) {
          recordsBody.innerHTML = '<tr><td colspan="2" class="center-text">Walang records pa.</td></tr>';
          return;
        }

        recordsBody.innerHTML = data
          .map(record => `
            <tr>
              <td>${escapeHtml(record.name)}</td>
              <td>${escapeHtml(record.address)}</td>
            </tr>
          `)
          .join("");
      } catch (error) {
        console.error("Error loading data:", error);
        recordsBody.innerHTML = '<tr><td colspan="2" class="center-text">Hindi ma-load ang data.</td></tr>';
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = {
        name: nameInput.value.trim(),
        address: addressInput.value.trim()
      };

      if (!payload.name || !payload.address) {
        alert("Pakilagay ang Name at Address.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Saving...";

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error("HTTP error: " + response.status);
        }

        const result = await response.json();

        if (result.status === "success") {
          form.reset();
          await loadRecords();
        } else {
          alert("May problema sa pag-save: " + (result.message || "Unknown error"));
        }
      } catch (error) {
        console.error("Error saving data:", error);
        alert("May error sa pag-save sa Google Sheets!");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Save to Google Sheets";
      }
    });

    loadRecords();
  </script>

</body>
</html>
