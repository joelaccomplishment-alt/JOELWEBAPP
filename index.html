<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Directory App</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    h2 { margin-top: 0; color: #333; text-align: center; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    button:disabled { background: #99c2ff; cursor: not-allowed; }
    #status { margin-top: 10px; text-align: center; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 25px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
    th { background: #f8f9fa; color: #333; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Register Information</h2>

    <form id="myForm">
      <label for="name">NAME:</label>
      <input type="text" id="name" placeholder="Ilagay ang pangalan" required>

      <label for="address">ADDRESS:</label>
      <input type="text" id="address" placeholder="Ilagay ang address" required>

      <button type="submit" id="submitBtn">Save to Google Sheets</button>
    </form>

    <div id="status"></div>

    <h3>Saved Records</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Address</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="2" style="text-align:center;">Loading data...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // PALITAN ITO NG IYONG GOOGLE APPS SCRIPT /exec URL
    const GAS_URL = "ILAGAY_DITO_ANG_GAS_URL";

    const form = document.getElementById("myForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusDiv = document.getElementById("status");
    const tableBody = document.getElementById("tableBody");

    // 1. Function para kunin at ipakita ang data mula sa Google Sheets
    async function loadRecords() {
      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();

        tableBody.innerHTML = "";
        if (data.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="2" style="text-align:center;">Wala pang laman.</td></tr>';
          return;
        }

        // Ipakita mula pinakabago pababa
        data.reverse().forEach(row => {
          const tr = document.createElement("tr");
          const tdName = document.createElement("td");
          const tdAddress = document.createElement("td");

          tdName.textContent = row.name;
          tdAddress.textContent = row.address;

          tr.appendChild(tdName);
          tr.appendChild(tdAddress);
          tableBody.appendChild(tr);
        });
      } catch (error) {
        tableBody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:red;">Error sa pag-load ng data.</td></tr>';
        console.error(error);
      }
    }

      e.preventDefault();
